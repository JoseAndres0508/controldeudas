<!DOCTYPE html>
<html lang="es-CR" data-theme="auto" data-fs="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Libro de deudas — control personal de deudas, cortes y pagos.">
<meta name="color-scheme" content="light dark">
<title>Libro de deudas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- El ?v= obliga al navegador a bajar la hoja de estilos nueva en vez de
     usar la que tiene guardada. Subí el número cada vez que cambie el CSS. -->
<link rel="stylesheet" href="css/styles.css?v=7">
<script>
  /* Aplica tema y tamaño de letra antes de pintar, para que no haya
     un parpadeo claro→oscuro al cargar la página. */
  (function () {
    try {
      var t = localStorage.getItem('ld-theme') || 'auto';
      var f = localStorage.getItem('ld-fs') || 'md';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-fs', f);
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="app-header">
  <div class="app-header-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">₡</div>
      <div class="brand-name">Libro de<br>deudas</div>
    </div>

    <div class="header-tools">
      <div class="fs-control" role="group" aria-label="Tamaño de letra">
        <button type="button" class="fs-a-sm" data-fs="sm" aria-pressed="false" title="Letra pequeña">A</button>
        <button type="button" class="fs-a-md" data-fs="md" aria-pressed="true" title="Letra normal">A</button>
        <button type="button" class="fs-a-lg" data-fs="lg" aria-pressed="false" title="Letra grande">A</button>
      </div>

      <button type="button" class="icon-btn" id="btnTheme" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Tema</span>
      </button>
    </div>
  </div>
</header>

<div class="shell">

<aside class="sidebar">
  <div class="search-wrap">
    <label class="sr-only" for="globalSearch">Buscar deuda o acreedor</label>
    <input id="globalSearch" type="search" placeholder="Buscar…" autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="globalSearchResults" aria-autocomplete="list">
    <div class="search-results" id="globalSearchResults" role="listbox" aria-label="Resultados de búsqueda"></div>
  </div>

  <nav class="side-nav" role="tablist" aria-label="Secciones">
    <button role="tab" id="tabbtn-inicio" data-tab="inicio" aria-selected="true" aria-controls="tab-inicio" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Inicio</span>
    </button>
    <button role="tab" id="tabbtn-deudas" data-tab="deudas" aria-selected="false" aria-controls="tab-deudas" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5h18"/></svg>
      <span>Ingresar deudas</span>
    </button>
    <button role="tab" id="tabbtn-cortes" data-tab="cortes" aria-selected="false" aria-controls="tab-cortes" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Cortes</span>
    </button>
    <button role="tab" id="tabbtn-estrategia" data-tab="estrategia" aria-selected="false" aria-controls="tab-estrategia" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
      <span>Estrategia</span>
    </button>
    <button role="tab" id="tabbtn-acreedores" data-tab="acreedores" aria-selected="false" aria-controls="tab-acreedores" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>
      <span>Acreedores</span>
    </button>
    <button role="tab" id="tabbtn-reportes" data-tab="reportes" aria-selected="false" aria-controls="tab-reportes" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Reportes</span>
    </button>
  </nav>

  <div class="side-foot">
    <button type="button" class="side-link" id="btnSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V19a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      <span>Ajustes</span>
    </button>
  </div>
</aside>

<main class="content" id="main" tabindex="-1">
  <div class="content-head">
    <h1 id="pageTitle">Inicio</h1>
    <div class="btn-row">
      <button class="btn" id="btnExport">Exportar respaldo</button>
      <button class="btn" id="btnImport">Importar</button>
      <input type="file" id="fileImport" accept="application/json" class="sr-only" tabindex="-1" aria-hidden="true">
    </div>
  </div>

  <section id="tab-inicio" role="tabpanel" aria-labelledby="tabbtn-inicio" tabindex="0"></section>
  <section id="tab-deudas" role="tabpanel" aria-labelledby="tabbtn-deudas" tabindex="0" hidden></section>
  <section id="tab-cortes" role="tabpanel" aria-labelledby="tabbtn-cortes" tabindex="0" hidden></section>
  <section id="tab-estrategia" role="tabpanel" aria-labelledby="tabbtn-estrategia" tabindex="0" hidden></section>
  <section id="tab-acreedores" role="tabpanel" aria-labelledby="tabbtn-acreedores" tabindex="0" hidden></section>
  <section id="tab-reportes" role="tabpanel" aria-labelledby="tabbtn-reportes" tabindex="0" hidden></section>
</main>

</div>

<footer class="app-footer">
  <div class="app-footer-in">
    <p><strong style="font-weight:500">Libro de deudas</strong> — control personal de deudas, cortes y pagos.</p>
    <nav class="foot-nav" aria-label="Enlaces del pie de página">
      <a href="#main">Ayuda</a>
      <a href="#main">Privacidad</a>
      <a href="#main">Términos</a>
      <a href="#main">Contacto</a>
    </nav>
    <p class="foot-meta">v0.5.0 · Datos guardados en este dispositivo · © 2026</p>
  </div>
</footer>

<div class="scrim" id="scrim">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="js/main.js?v=7"></script>
</body>
</html>
